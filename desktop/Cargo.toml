[package]
name = "research-desktop"
version = "2.0.1"
description = "Local-first research, no login, no server (docs/12 M9, docs/13 §7)"
authors = ["Research Engine"]
edition = "2021"

# The shell is deliberately thin: spawn + supervise the Python sidecar, hand the
# handshake to the WebView, stay out of everything else. tauri-plugin-shell (docs/07
# §2, Phase 2b) is the one deliberate exception — start_local_server/stop_local_server
# need to spawn `ollama serve`, scoped to exactly that binary in capabilities/default.json.
#
# UNVERIFIED: written to the plan's spec but never compiled or run — this environment
# has no Rust toolchain. The Python sidecar (app/services/local_llm.py,
# desktop/sidecar.py::start_local_server/stop_local_server) already spawns and
# supervises `ollama serve` directly via asyncio, needing no Tauri permission at all —
# it is a plain OS process, not WebView-sandboxed. That path is tested and working on
# its own. This Rust layer is a second, parallel mechanism for the same action; verify
# `cargo build` and a real desktop launch before trusting it, and decide whether the
# frontend should call this via `invoke()` at all or stay on the sidecar's HTTP path.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Smaller signed binaries matter for the desktop download size (docs/13 §7).
codegen-units = 1
lto = true
opt-level = "s"
strip = true
