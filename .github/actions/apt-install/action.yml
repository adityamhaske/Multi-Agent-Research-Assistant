name: apt-install
description: >
  Install Debian packages, bounding each attempt and retrying. Exists because an
  unbounded `apt-get` is the single most common way a job on this repo hangs.

# Why this is an action and not three copies of a shell loop: the same two-line
# `apt-get update && apt-get install` appeared in ci.yml twice and desktop.yml once,
# and on 2026-08-19 it wedged five separate jobs — one for 90 minutes — while other
# jobs in the same minute ran it in six seconds. A hung mirror connection never
# returns, so the job burns its whole timeout and the log ends mid-step, naming
# nothing. Bounding each attempt turns a silent hour into a warning and a retry.
#
# Deliberately NOT changed here: the install itself. No --no-install-recommends,
# no --fix-missing, no mirror swap. Those alter which packages land, and WeasyPrint
# and the Tauri shell both depend on what these pull in today. This wraps the same
# command; it does not tune it.

inputs:
  packages:
    description: Space-separated package names, passed through unquoted on purpose.
    required: true
  attempts:
    description: How many times to try before giving up.
    required: false
    default: "2"
  timeout-seconds:
    description: >
      Wall-clock bound on each individual apt invocation. This guards against a
      connection that has stopped responding, NOT against slowness, and those need
      very different numbers: `apt-get install` of these package sets takes ~6-80s,
      but a full `apt-get update` refreshes every index for main/restricted/universe/
      multiverse across two suites — tens of megabytes — and legitimately runs for
      minutes on a congested mirror. A 180s bound was sized against the install and
      killed an update that was still actively downloading. 300s is far above any
      observed working refresh and far below the 90-minute stalls this exists to stop.
      The workflow step also carries its own `timeout-minutes` as a hard ceiling, so
      raising this cannot bring back an unbounded job.
    required: false
    default: "300"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        APT_ATTEMPTS: ${{ inputs.attempts }}
        APT_TIMEOUT: ${{ inputs.timeout-seconds }}
      run: |
        # No `set -e`: a failed stage must fall through to the next, not end the step.
        set -uo pipefail

        # Stage 0 — is there anything to do at all? The runner image already carries a
        # great many libraries as transitive dependencies, and a package that is present
        # needs no index, no mirror and no network. This is the only stage that can
        # succeed while the archive is unreachable, so it goes first.
        missing=""
        for pkg in $APT_PACKAGES; do
          dpkg -s "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
        done
        missing="${missing# }"
        if [ -z "$missing" ]; then
          echo "already installed, no network needed: $APT_PACKAGES"
          exit 0
        fi
        echo "missing: $missing"

        # Stage 1 — install from the index the image already ships, without refreshing it.
        # `apt-get update` is the operation that fails here: it contacts every source for
        # every index, so one wedged mirror entry stalls the whole command even when the
        # host serving the package is answering fine. Measured on 2026-08-19: an update
        # pulled three InRelease files from archive.ubuntu.com successfully and then sat
        # for 140s on the remaining entries until the bound killed it. The shipped index
        # is usually only hours stale and names these packages perfectly well, so trying
        # the install first skips the fragile step entirely in the common case.
        # shellcheck disable=SC2086
        if sudo timeout "$APT_TIMEOUT" apt-get install -y $missing; then
          echo "installed from the image's existing index; no apt-get update required"
          exit 0
        fi
        echo "::warning::install from the shipped index failed; refreshing it"

        # Stage 2 — only now pay for an update, bounded and retried.
        for attempt in $(seq 1 "$APT_ATTEMPTS"); do
          # `sudo timeout` rather than `timeout sudo`, so the kill signal reaches
          # apt-get itself instead of a sudo wrapper that may not forward it.
          # shellcheck disable=SC2086
          if sudo timeout "$APT_TIMEOUT" apt-get update \
            && sudo timeout "$APT_TIMEOUT" apt-get install -y $missing; then
            echo "apt-get succeeded on attempt ${attempt}/${APT_ATTEMPTS}"
            exit 0
          fi
          echo "::warning::apt-get attempt ${attempt}/${APT_ATTEMPTS} failed or exceeded ${APT_TIMEOUT}s"
          # A timed-out `update` can leave a half-written package index behind, which
          # makes every later attempt fail for a different reason than the first one.
          sudo rm -rf /var/lib/apt/lists/*
          if [ "$attempt" -eq 1 ]; then
            # Retrying the same host does not help: a wedged mirror connection is
            # per-runner and does not heal on request. Point every Ubuntu archive entry
            # at the canonical host, which was measured responding normally from a runner
            # whose default mirror had stalled. Both the deb822 (.sources) and legacy
            # (.list) layouts are rewritten, since the image has moved between them.
            echo "switching remaining attempts to archive.ubuntu.com"
            sudo sed -i -E 's#https?://[A-Za-z0-9.-]*archive\.ubuntu\.com#http://archive.ubuntu.com#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            # Prove the rewrite actually landed, rather than assuming a glob matched.
            if grep -rqs 'azure\.archive\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null; then
              echo "::warning::azure mirror entries survived the rewrite; sources are:"
              grep -rs 'ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true
            fi
          fi
          sleep $(( attempt * 5 ))
        done
        echo "::error::apt-get failed after ${APT_ATTEMPTS} attempts — see the warnings above for which stage"
        exit 1
