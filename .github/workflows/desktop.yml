name: Desktop

# M9 (docs/12): the desktop app is two artifacts — the Python sidecar (PyInstaller
# one-dir) and the Tauri shell. This workflow builds and smoke-tests BOTH on all three
# target OSes so a broken bundle can never reach a release tag.

on:
  push:
    branches: [main]
    # A `v*` tag additionally publishes the bundles to a GitHub Release (docs/17 §5).
    # Branch and PR runs keep uploading 14-day artifacts and publish nothing, so the
    # build that gates a merge is the same build that ships.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the release job attaches bundles to a GitHub Release

jobs:
  sidecar:
    name: Sidecar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pyinstaller
      - name: Build one-dir bundle
        working-directory: backend
        run: pyinstaller desktop/research-sidecar.spec --noconfirm
      - name: Smoke — handshake, token gate, watchdog flag
        working-directory: backend
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -e
          BIN=dist/research-sidecar/research-sidecar
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          "$BIN" --fake > /tmp/sidecar.log 2>&1 &
          PID=$!
          # Wait for the handshake line.
          for i in $(seq 1 60); do
            grep -q '"ready": true' /tmp/sidecar.log && break
            kill -0 $PID || { cat /tmp/sidecar.log; exit 1; }
            sleep 1
          done
          grep -q '"ready": true' /tmp/sidecar.log || { cat /tmp/sidecar.log; exit 1; }
          PORT=$(sed -n 's/.*"port": \([0-9]*\).*/\1/p' /tmp/sidecar.log | head -1)
          TOKEN=$(sed -n 's/.*"token": "\([^"]*\)".*/\1/p' /tmp/sidecar.log | head -1)
          # The handshake prints just before uvicorn binds — wait for the socket.
          for i in $(seq 1 30); do
            curl -s -o /dev/null "http://127.0.0.1:$PORT/api/v1/auth/me" && break
            kill -0 $PID || { cat /tmp/sidecar.log; exit 1; }
            sleep 1
          done
          # The DoD security assertion: an unauthenticated localhost request is rejected.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/api/v1/auth/me")
          [ "$CODE" = "401" ] || { echo "expected 401 without token, got $CODE"; exit 1; }
          # And the token unlocks the same endpoint.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:$PORT/api/v1/auth/me")
          [ "$CODE" = "200" ] || { echo "expected 200 with token, got $CODE"; exit 1; }
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "SIDECAR_PID=$PID" >> "$GITHUB_ENV"
          echo "sidecar smoke passed on $RUNNER_OS"
      - name: Smoke — a run reaches a bundle the standalone verifier passes
        # Issue #50: the bundle route was added to the sidecar and only ever exercised
        # through ASGI, from a checkout that has every package the spec *excludes*. A
        # source-level test structurally cannot catch a missing import in the bundle, and
        # the documented failure mode of this repository is exactly that — three copies of
        # the sidecar's location wrong at once, CI green, the app dead on first launch.
        #
        # So this drives the packaged binary the way the app does: create, both gates,
        # export, and then the shipped verifier's own verdict on what came out. It reaches
        # `build_graph`, the audit-log writes behind the approval chain, and the bundle
        # assembler — none of which the token check above touches.
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          B="http://127.0.0.1:$PORT/api/v1"
          H="Authorization: Bearer $TOKEN"
          api() { curl -sf -H "$H" -H 'Content-Type: application/json' "$@"; }

          PID_JSON=$(api -X POST -d '{"name":"CI"}' "$B/projects")
          PROJECT=$(python -c "import json,sys;print(json.loads(sys.argv[1])['id'])" "$PID_JSON")

          RUN_JSON=$(api -X POST "$B/runs" -d "{\"project_id\":\"$PROJECT\",\"question\":\"What are the leading approaches to long-term memory in LLM agents?\",\"depth\":\"fast\",\"skip_plan_gate\":false,\"dispatch\":true}")
          RUN=$(python -c "import json,sys;print(json.loads(sys.argv[1])['run_id'])" "$RUN_JSON")
          echo "run $RUN created"

          # `dispatch: true` on this host means an in-process asyncio task, not a broker.
          await_status() {
            for _ in $(seq 1 180); do
              s=$(api "$B/runs/$RUN" | python -c "import json,sys;print(json.load(sys.stdin)['run']['status'])")
              [ "$s" = "$1" ] && { echo "reached $1"; return 0; }
              case "$s" in FAILED|CANCELLED) echo "::error::run ended $s while waiting for $1"; return 1;; esac
              sleep 1
            done
            echo "::error::run never reached $1 (last: $s)"; return 1
          }

          await_status AWAITING_PLAN
          api -X POST -d '{"decision":"APPROVED"}' "$B/runs/$RUN/plan-review" > /dev/null
          await_status AWAITING_REVIEW
          api -X POST -d '{"decision":"APPROVED"}' "$B/runs/$RUN/report-review" > /dev/null

          # Written into the working directory, not /tmp. Git Bash on Windows maps `/tmp`
          # onto its own installation prefix while the Windows Python two lines down
          # resolves the same string literally against the current drive — so `curl -o
          # /tmp/x` and `open("/tmp/x")` name different files, and the check below failed
          # with FileNotFoundError on a bundle that had downloaded perfectly.
          curl -sf -H "$H" "$B/runs/$RUN/bundle.json" -o ci.bundle.json
          curl -sf -H "$H" "$B/runs/$RUN/export.md" -o ci-report.md
          test -s ci-report.md

          # PDF is deliberately unavailable on this host — WeasyPrint is excluded from the
          # bundle. A 501 is the contract; a 200 would mean the exclude stopped working.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "$H" "$B/runs/$RUN/export.pdf")
          [ "$CODE" = "501" ] || { echo "::error::expected 501 for desktop PDF, got $CODE"; exit 1; }

          # The verdict that matters, from the verifier as a third party would run it.
          python -m research_engine.verify_bundle ci.bundle.json
          python - <<'CHECK'
          import json
          b = json.load(open("ci.bundle.json"))
          actions = [a["action"] for a in b["approval_chain"]]
          assert "approved" in actions, f"no report approval in the chain: {actions}"
          assert b["evidence"], "the packaged app produced a bundle with no evidence"
          assert b["demo"] is True, "a scripted run must be stamped as a demo"
          print("approval chain:", actions, "| evidence:", len(b["evidence"]))
          CHECK
          kill "$SIDECAR_PID" || true
          echo "packaged-app research journey verified on $RUNNER_OS"
      - name: Upload sidecar bundle
        uses: actions/upload-artifact@v7
        with:
          name: research-sidecar-${{ matrix.os }}
          path: backend/dist/research-sidecar/
          retention-days: 14

  shell:
    name: Shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The bundler copies `backend/dist/research-sidecar/` in as a resource, so the sidecar
    # has to exist before `tauri build` runs. Without this the two jobs raced and the shell
    # always won, producing a 5 MB bundle with no backend that failed on first launch.
    needs: sidecar
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the sidecar built for this OS
        uses: actions/download-artifact@v8
        with:
          name: research-sidecar-${{ matrix.os }}
          path: backend/dist/research-sidecar/
      - name: Restore the sidecar's executable bit
        if: runner.os != 'Windows'
        # upload-artifact does not preserve POSIX permissions, so the launcher comes back
        # mode 644 and the app cannot exec it.
        run: chmod +x backend/dist/research-sidecar/research-sidecar
      - name: Linux build dependencies (WebKitGTK etc.)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        # Hard ceiling over the action's own per-attempt bounds — see ci.yml. This is the
        # only call site that does real work: the WeasyPrint pair is already on the runner
        # image, while none of these -dev packages are, so this is where both the refresh
        # and a several-hundred-megabyte install actually happen. Sized to allow every
        # attempt the action permits rather than to the observed happy path.
        timeout-minutes: 35
        with:
          packages: >-
            libwebkit2gtk-4.1-dev build-essential curl wget file
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install shell dependencies
        working-directory: desktop
        run: npm install
      - name: Build Tauri app (bundles the static export; runs cargo build)
        working-directory: desktop
        run: npx tauri build
      - name: The bundle actually contains the backend
        shell: bash
        # AGENTS.md's worked example of a green build that died on first launch: all three
        # copies of the sidecar's location were wrong at once, `tauri build` succeeded, the
        # artifact uploaded cleanly, and the app shipped at ~5 MB with no backend inside.
        # Building is not the assertion — what ended up in the bundle is.
        #
        # The two branches are not laziness about Windows. macOS produces a real directory
        # (`.app/Contents/Resources/sidecar/`) whose contents can be inspected directly, so
        # they are. An `.msi` is a compressed archive with the payload inside it, so the
        # only honest check without installing it is its size — which still catches the
        # failure being guarded, because 5 MB does not compress out of 140.
        run: |
          set -euo pipefail
          out=desktop/target/release/bundle
          found=$(find "$out" -type f \
            \( -name 'research-sidecar' -o -name 'research-sidecar.exe' \) -print -quit)

          if [ -n "$found" ]; then
            root=$(dirname "$found")
            total=$(du -sk "$root" | cut -f1)
            echo "sidecar tree at $root: ${total} KiB"
            # 60 MB floor against a real 140-200 MB tree: far enough below that a
            # dependency drop does not fail the build, far enough above 5 MB that the
            # failure cannot pass.
            if [ "$total" -lt 61440 ]; then
              echo "::error::sidecar tree is ${total} KiB — too small to contain the engine"
              exit 1
            fi
            exit 0
          fi

          # No loose executable: the payload is packed into an installer.
          biggest=$(find "$out" -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec du -k {} + | sort -rn | head -1)
          if [ -z "$biggest" ]; then
            echo "::error::no installer and no sidecar in the bundle output"
            find "$out" -maxdepth 4
            exit 1
          fi
          size=$(echo "$biggest" | cut -f1)
          name=$(echo "$biggest" | cut -f2-)
          echo "largest installer: $name (${size} KiB)"
          # 40 MB: an installer compresses the same payload, so the floor sits lower than
          # the uncompressed one above and still an order of magnitude above the failure.
          if [ "$size" -lt 40960 ]; then
            echo "::error::$name is ${size} KiB — too small to contain the engine"
            exit 1
          fi
      - name: Upload shell bundle
        uses: actions/upload-artifact@v7
        with:
          name: research-desktop-shell-${{ matrix.os }}
          path: |
            desktop/target/release/bundle/
          retention-days: 14

  release:
    name: Publish release
    # Only on a version tag. Every other trigger stops at the 14-day artifacts above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sidecar, shell]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download every shell bundle
        uses: actions/download-artifact@v8
        with:
          pattern: research-desktop-shell-*
          path: artifacts
      - name: Collect installers and checksum them
        run: |
          set -euo pipefail
          mkdir -p release
          # Bundle layouts differ per OS (dmg/, msi/, appimage/, deb/), so collect by
          # extension rather than by path and flatten into one directory.
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} release/ \;
          cd release
          # Squeeze spaces out of the names BEFORE hashing. The bundler names files after
          # productName ("Research Assistant_1.0.1_aarch64.dmg"), and GitHub rewrites the
          # space to a dot when it serves the asset — so a SHA256SUMS generated from the
          # original names lists a file nobody can download under that name, and
          # `shasum -c` answers "no file was verified". The hashes were right; the names
          # were not, which is worse than shipping no checksums at all.
          for f in *\ *; do [ -e "$f" ] && mv "$f" "${f// /.}"; done
          # An unsigned artifact that also cannot be verified is worse than an unsigned
          # one that can: the checksum is what lets a careful user confirm the download
          # matches what CI produced (docs/17 §5).
          sha256sum * > SHA256SUMS
          echo "--- published artifacts ---"
          cat SHA256SUMS
      - name: Fail if no installers were produced
        run: |
          # A green release with an empty asset list is the worst outcome: it looks like
          # a successful ship and hands users nothing.
          count=$(find release -type f ! -name SHA256SUMS | wc -l)
          echo "installer count: $count"
          test "$count" -gt 0
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          draft: false
          # Pre-release for anything carrying a suffix (v1.0.0-rc1, -beta). Unsigned
          # desktop bundles are new territory here; the tag decides, not a human.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Desktop bundles for ${{ github.ref_name }}.

            **These builds are not code-signed.** Your OS will warn you on first launch:

            | OS | What you will see | What to do |
            |---|---|---|
            | macOS | "Apple could not verify this app is free of malware" | System Settings → Privacy & Security → **Open Anyway** |
            | Windows | SmartScreen warning | **More info** → **Run anyway** |
            | Linux | AppImage is not executable | `chmod +x *.AppImage` (`.deb` needs nothing) |

            Verify your download against `SHA256SUMS` before running it:

            ```
            sha256sum -c SHA256SUMS --ignore-missing
            ```
