name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system deps (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check app/ tests/
      - name: Format check
        run: ruff format --check app/ tests/
      - name: Tests
        run: python -m pytest tests/ -v --tb=short
        env:
          ENVIRONMENT: test
          LLM_MODE: fake
          JWT_SECRET_KEY: ci-secret-0123456789abcdef0123456789abcdef
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Markdown safety guard (docs/06 §5)
        run: |
          ! grep -rn --include='*.tsx' --include='*.ts' -e 'rehype-raw' -e 'dangerouslySetInnerHTML' app/ components/ || \
          (echo '::error::Banned pattern found (rehype-raw / dangerouslySetInnerHTML)'; exit 1)
      - name: Build
        run: npm run build
