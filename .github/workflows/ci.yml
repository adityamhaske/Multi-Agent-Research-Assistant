name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      LLM_MODE: fake
      JWT_SECRET_KEY: ci-secret-0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system deps (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check app/ tests/ evals/
      - name: Format check
        run: ruff format --check app/ tests/ evals/
      - name: Migrations apply (schema built purely from Alembic)
        run: alembic upgrade head
      - name: Tests
        run: python -m pytest tests/ -v --tb=short
      - name: Dependency audit (non-blocking, docs/08 §4)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Markdown safety guard (docs/06 §5)
        run: |
          ! grep -rn --include='*.tsx' --include='*.ts' -e 'rehype-raw' -e 'dangerouslySetInnerHTML' app/ components/ lib/ hooks/ || \
          (echo '::error::Banned pattern found (rehype-raw / dangerouslySetInnerHTML)'; exit 1)
      - name: Token hygiene guard (docs/03, docs/07 §1)
        run: |
          set -e
          fail=0
          if grep -rnE '#[0-9a-fA-F]{3,8}\b' --include='*.tsx' --include='*.ts' app/ components/ lib/ hooks/; then
            echo '::error::Hardcoded hex color found — use a design token (docs/07 §1)'; fail=1
          fi
          if grep -rnE 'localhost:8000|NEXT_PUBLIC_API_URL|127\.0\.0\.1:8000' --include='*.tsx' --include='*.ts' app/ components/ lib/ hooks/; then
            echo '::error::Hardcoded backend URL found — call the same-origin /api proxy (docs/06 §6)'; fail=1
          fi
          if grep -rnE '(local|session)Storage' --include='*.tsx' --include='*.ts' app/ components/ lib/ hooks/; then
            echo '::error::Web storage use found — auth is httpOnly cookies only (docs/03)'; fail=1
          fi
          exit $fail
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (non-blocking, docs/08 §4)
        continue-on-error: true
        run: npm audit --audit-level=critical

  golden-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      LLM_MODE: fake
      JWT_SECRET_KEY: ci-secret-0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/1
      BACKEND_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system deps (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Start API (fake-LLM)
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level warning &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 1;
          done
      - name: Start Celery worker (fake-LLM)
        working-directory: backend
        run: |
          celery -A app.workers.celery_app.celery_app worker --concurrency=1 --loglevel=warning &
          echo $! > /tmp/worker.pid
          sleep 5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start frontend (same-origin /api proxy → backend)
        working-directory: frontend
        run: |
          npm run start -- --port 3000 &
          echo $! > /tmp/web.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login && break || sleep 1;
          done
      - name: Run golden E2E (Playwright)
        working-directory: frontend
        env:
          E2E_NO_SERVER: "1"
          E2E_BASE_URL: http://localhost:3000
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
